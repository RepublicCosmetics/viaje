<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Republic Cosmetics · Sistemas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<style>
  :root{
    --bg:#0e1a2b; --panel:#13233a; --line:#23385a; --ink:#ece5d3; --muted:#8e9ab0; --gold:#d4af37;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:40px 20px 32px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:2rem;line-height:1.15;margin:0 0 4px;color:var(--gold)}
  .sub{color:var(--muted);margin:0 0 28px;font-size:.95rem}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li a{display:flex;align-items:center;gap:16px;padding:16px 8px 16px 14px;color:inherit;text-decoration:none;
    border-bottom:1px solid var(--line);border-left:3px solid var(--c,var(--gold));transition:background .15s}
  li a:hover{background:var(--panel)}
  li a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .ico{font-size:1.7rem;width:2.2rem;text-align:center;flex:none}
  .txt{flex:1;min-width:0}
  .nom{display:block;font-weight:600;font-size:1.05rem;color:var(--c,var(--ink))}
  .des{display:block;color:var(--muted);font-size:.88rem}
  .copy{flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
    padding:6px 10px;font:inherit;font-size:.8rem;cursor:pointer}
  .copy:hover{color:var(--ink);border-color:var(--muted)}
  .estado{margin-top:22px;color:var(--muted);font-size:.85rem}
  .aviso{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:8px}
  .aviso strong{color:var(--gold)}
  @media (prefers-reduced-motion:reduce){li a{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Republic Cosmetics</h1>
  <p class="sub">Sistemas internos de Compras</p>
  <div id="contenido"><p class="estado">Buscando el servidor…</p></div>
</main>
<script>
(async () => {
  const cont = document.getElementById('contenido');
  const pedido = new URLSearchParams(location.search).get('app');

  let data;
  try {
    const r = await fetch('apps.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    // Compatibilidad: si aún no existe apps.json, usar url.txt como antes
    try {
      const r = await fetch('url.txt?t=' + Date.now(), { cache: 'no-store' });
      const u = (await r.text()).trim();
      if (u.startsWith('https://')) { location.replace(u); return; }
    } catch (_) {}
    cont.innerHTML = '<div class="aviso"><strong>El servidor no está publicado.</strong><br>Abre el launcher en la compu de Compras y vuelve a cargar esta página.</div>';
    return;
  }

  const base = data.base.replace(/\/+$/, '');
  const apps = data.apps || [];

  if (pedido) {
    const app = apps.find(a => a.id === pedido);
    if (app) { location.replace(base + app.ruta); return; }
  }

  const pagina = location.origin + location.pathname;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  cont.innerHTML =
    (pedido ? `<p class="estado">No existe el sistema “${esc(pedido)}”. Elige uno:</p>` : '') +
    '<ul>' + apps.map(a => `
      <li><a href="${esc(base + a.ruta)}" style="--c:${esc(a.color || '')}">
        <span class="ico" aria-hidden="true">${esc(a.icono || '•')}</span>
        <span class="txt"><span class="nom">${esc(a.nombre)}</span><span class="des">${esc(a.desc || '')}</span></span>
        <button class="copy" type="button" data-link="${esc(pagina + '?app=' + a.id)}" aria-label="Copiar link de ${esc(a.nombre)}">Copiar link</button>
      </a></li>`).join('') + '</ul>' +
    `<p class="estado">Servidor publicado: ${esc(data.actualizado || '—')}. Si un sistema no abre, el launcher puede estar apagado.</p>`;

  cont.addEventListener('click', async ev => {
    const b = ev.target.closest('.copy');
    if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    try { await navigator.clipboard.writeText(b.dataset.link); b.textContent = 'Copiado'; }
    catch { prompt('Copia este link:', b.dataset.link); }
    setTimeout(() => b.textContent = 'Copiar link', 1500);
  });
})();
</script>
</body>
</html>
